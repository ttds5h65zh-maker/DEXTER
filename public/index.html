<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dexter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5f5b'/%3E%3Cpath d='M10 8h6a8 8 0 0 1 0 16h-6z' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Main"></nav>
  <div id="col">
    <header id="top">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search sources, findings, tasks and drafts" autocomplete="off" aria-label="Search">
        <kbd>/</kbd>
      </label>
      <span id="save-pill" class="pill save" hidden></span>
      <a id="ai-pill" class="pill" href="#/settings"></a>
      <button class="btn primary" data-action="open-import" aria-label="Import source" title="Import source">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Import source</span>
      </button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
