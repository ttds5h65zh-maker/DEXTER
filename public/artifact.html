<title>Dexter</title>
<meta name="dexter-mode" content="hosted">
<link rel="stylesheet" href="styles.css">
<div id="app">
  <nav id="nav" aria-label="Main"></nav>
  <div id="col">
    <header id="top">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search sources, findings, tasks and drafts" autocomplete="off" aria-label="Search">
        <kbd>/</kbd>
      </label>
      <span id="save-pill" class="pill save" hidden></span>
      <a id="ai-pill" class="pill" href="#/settings"></a>
      <button class="btn primary" data-action="open-import" aria-label="Import source" title="Import source">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Import source</span>
      </button>
    </header>
    <main id="main" tabindex="-1">
      <div class="page"><div class="card empty"><b>Opening your command center…</b>Loading your sources, tasks and drafts.</div></div>
    </main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script type="module" src="app.js"></script>
